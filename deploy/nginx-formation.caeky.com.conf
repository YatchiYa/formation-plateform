# /etc/nginx/sites-available/formation.caeky.com.conf
# HTTPS lines are added by: sudo certbot --nginx -d formation.caeky.com
server {
    listen 80;
    listen [::]:80;
    server_name formation.caeky.com;

    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js static assets are content-hashed: cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3090;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
