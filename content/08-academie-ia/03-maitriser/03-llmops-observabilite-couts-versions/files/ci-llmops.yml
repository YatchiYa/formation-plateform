# Exemple GitHub Actions : à copier dans .github/workflows/ci-llmops.yml
# 1) tests hors ligne à chaque push ; 2) non-régression réelle quand prompts.json change.
name: llmops
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests-hors-ligne:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q                       # sans clé : registre, wrapper, rapport, porte de régression
  non-regression:
    runs-on: ubuntu-latest
    needs: tests-hors-ligne
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: prompts.json a-t-il changé ?
        id: diff
        run: echo "changed=$(git diff --name-only origin/main...HEAD | grep -c prompts.json || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed != '0'
        with: {python-version: "3.12"}
      - if: steps.diff.outputs.changed != '0'
        run: pip install -r requirements.txt
      - name: Version candidate contre la référence
        if: steps.diff.outputs.changed != '0'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OTEL_EXPORTER: none
        run: python regression.py --version "$(python -c 'import json; print(json.load(open("prompts.json"))["router"]["production"])')"
